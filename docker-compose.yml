name: signal-local

services:
  oracle-db:
    profiles: ["local-db"]
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: signal-oracle-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Oracle123!}
      APP_USER: bootstrap
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-Signal123!}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD:-Signal123!}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./scripts/init-local-oracle.sh:/container-entrypoint-initdb.d/01-init-local-oracle.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'SELECT 1 FROM dual;' | sqlplus -s system/$${ORACLE_PASSWORD}@//localhost:1521/$${ORACLE_SERVICE_NAME:-FREEPDB1} >/dev/null",
        ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: signal-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  signal-auth-service:
    build:
      context: .
      dockerfile: dockerfiles/signal-auth-service.Dockerfile
    container_name: signal-auth-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-0}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-10000}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME:-120000}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-30000}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-with-at-least-32-characters}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${AUTH_PORT:-8081}:8081"
    restart: unless-stopped

  signal-sales-service:
    build:
      context: .
      dockerfile: dockerfiles/signal-sales-service.Dockerfile
    container_name: signal-sales-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      signal-auth-service:
        condition: service_started
    environment:
      SERVER_PORT: 8082
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-0}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-10000}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME:-120000}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-30000}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-with-at-least-32-characters}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://signal-auth-service:8081}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${SALES_PORT:-8082}:8082"
    restart: unless-stopped

  signal-payment-service:
    build:
      context: .
      dockerfile: dockerfiles/signal-payment-service.Dockerfile
    container_name: signal-payment-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      signal-auth-service:
        condition: service_started
    environment:
      SERVER_PORT: 8083
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-0}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-10000}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME:-120000}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-30000}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-with-at-least-32-characters}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://signal-auth-service:8081}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${PAYMENT_PORT:-8083}:8083"
    restart: unless-stopped

  signal-analytics-ai-service:
    build:
      context: .
      dockerfile: dockerfiles/signal-analytics-ai-service.Dockerfile
    container_name: signal-analytics-ai-service
    depends_on:
      signal-auth-service:
        condition: service_started
      signal-sales-service:
        condition: service_started
      signal-payment-service:
        condition: service_started
    environment:
      SERVER_PORT: 8084
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-0}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-10000}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME:-120000}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-30000}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-with-at-least-32-characters}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://signal-auth-service:8081}
      SALES_SERVICE_URL: ${SALES_SERVICE_URL:-http://signal-sales-service:8082}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://signal-payment-service:8083}
      GROQ_API_KEY: ${GROQ_API_KEY:-put-your-groq-api-key-here}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-160}
      AI_RETRIEVAL_MAX_CHUNKS: ${AI_RETRIEVAL_MAX_CHUNKS:-3}
    ports:
      - "${ANALYTICS_PORT:-8084}:8084"
    restart: unless-stopped

volumes:
  oracle-data:
