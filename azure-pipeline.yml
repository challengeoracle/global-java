trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  javaVersion: '21'
  artifactName: 'offpay-drop'
  mavenCacheFolder: '$(Pipeline.Workspace)/.m2/repository'
  azureSubscription: 'Conexao-Azure-DevOps'
  dockerRegistryServiceConnection: 'Conexao-ACR'
  acrName: 'offpayacrrm559728'
  authImageRepository: 'offpay-auth-service'
  salesImageRepository: 'offpay-sales-service'
  paymentImageRepository: 'offpay-payment-service'
  analyticsImageRepository: 'offpay-analytics-service'
  authWebAppName: 'app-offpay-auth-rm559728'
  salesWebAppName: 'app-offpay-sales-rm559728'
  paymentWebAppName: 'app-offpay-payment-rm559728'
  analyticsWebAppName: 'app-offpay-analytics-rm559728'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build and Publish Artifacts
    jobs:
      - job: BuildMonorepo
        displayName: Build OffPay Services
        steps:
          - task: Cache@2
            displayName: Cache Maven Repository
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(mavenCacheFolder)

          - task: JavaToolInstaller@0
            displayName: Use Java $(javaVersion)
            inputs:
              versionSpec: $(javaVersion)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Maven@4
            displayName: Run Auth Unit Tests
            inputs:
              mavenPomFile: signal-auth-service/pom.xml
              goals: test
              publishJUnitResults: false
              options: >-
                -Dmaven.repo.local=$(mavenCacheFolder)
                -Dspring.profiles.active=test

          - task: Maven@4
            displayName: Run Analytics Context Tests
            inputs:
              mavenPomFile: signal-analytics-ai-service/pom.xml
              goals: test
              publishJUnitResults: false
              options: >-
                -Dmaven.repo.local=$(mavenCacheFolder)
                -Dspring.profiles.active=test

          - task: PublishTestResults@2
            displayName: Publish JUnit Results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              failTaskOnFailedTests: true
              testRunTitle: OffPay JUnit Tests

          - task: Maven@4
            displayName: Package Auth Service
            inputs:
              mavenPomFile: signal-auth-service/pom.xml
              goals: clean package
              publishJUnitResults: false
              options: >-
                -Dmaven.repo.local=$(mavenCacheFolder)
                -DskipTests

          - task: Maven@4
            displayName: Package Sales Service
            inputs:
              mavenPomFile: signal-sales-service/pom.xml
              goals: clean package
              publishJUnitResults: false
              options: >-
                -Dmaven.repo.local=$(mavenCacheFolder)
                -DskipTests

          - task: Maven@4
            displayName: Package Payment Service
            inputs:
              mavenPomFile: signal-payment-service/pom.xml
              goals: clean package
              publishJUnitResults: false
              options: >-
                -Dmaven.repo.local=$(mavenCacheFolder)
                -DskipTests

          - task: Maven@4
            displayName: Package Analytics Service
            inputs:
              mavenPomFile: signal-analytics-ai-service/pom.xml
              goals: clean package
              publishJUnitResults: false
              options: >-
                -Dmaven.repo.local=$(mavenCacheFolder)
                -DskipTests

          - task: Docker@2
            displayName: Login to Azure Container Registry
            inputs:
              containerRegistry: $(dockerRegistryServiceConnection)
              command: login

          - script: |
              docker build -f dockerfiles/signal-auth-service.Dockerfile -t $(acrName).azurecr.io/$(authImageRepository):$(tag) -t $(acrName).azurecr.io/$(authImageRepository):latest .
            displayName: Build Auth Image

          - script: |
              docker push $(acrName).azurecr.io/$(authImageRepository):$(tag)
              docker push $(acrName).azurecr.io/$(authImageRepository):latest
            displayName: Push Auth Image

          - script: |
              docker build -f dockerfiles/signal-sales-service.Dockerfile -t $(acrName).azurecr.io/$(salesImageRepository):$(tag) -t $(acrName).azurecr.io/$(salesImageRepository):latest .
            displayName: Build Sales Image

          - script: |
              docker push $(acrName).azurecr.io/$(salesImageRepository):$(tag)
              docker push $(acrName).azurecr.io/$(salesImageRepository):latest
            displayName: Push Sales Image

          - script: |
              docker build -f dockerfiles/signal-payment-service.Dockerfile -t $(acrName).azurecr.io/$(paymentImageRepository):$(tag) -t $(acrName).azurecr.io/$(paymentImageRepository):latest .
            displayName: Build Payment Image

          - script: |
              docker push $(acrName).azurecr.io/$(paymentImageRepository):$(tag)
              docker push $(acrName).azurecr.io/$(paymentImageRepository):latest
            displayName: Push Payment Image

          - script: |
              docker build -f dockerfiles/signal-analytics-ai-service.Dockerfile -t $(acrName).azurecr.io/$(analyticsImageRepository):$(tag) -t $(acrName).azurecr.io/$(analyticsImageRepository):latest .
            displayName: Build Analytics Image

          - script: |
              docker push $(acrName).azurecr.io/$(analyticsImageRepository):$(tag)
              docker push $(acrName).azurecr.io/$(analyticsImageRepository):latest
            displayName: Push Analytics Image

          - task: CopyFiles@2
            displayName: Stage Build Outputs
            inputs:
              SourceFolder: $(Build.SourcesDirectory)
              Contents: |
                signal-auth-service/target/*.jar
                signal-sales-service/target/*.jar
                signal-payment-service/target/*.jar
                signal-analytics-ai-service/target/*.jar
                dockerfiles/**
                scripts/**
                docker-compose.yml
                README.md
                azure-pipeline.yml
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - task: PublishBuildArtifacts@1
            displayName: Publish Build Artifact
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: $(artifactName)
              publishLocation: Container

  - stage: Deploy
    displayName: Release to Azure
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployAuth
        displayName: Deploy Auth Service
        steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy Auth Container
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(authWebAppName)
              containers: $(acrName).azurecr.io/$(authImageRepository):$(tag)

      - job: DeploySales
        displayName: Deploy Sales Service
        steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy Sales Container
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(salesWebAppName)
              containers: $(acrName).azurecr.io/$(salesImageRepository):$(tag)

      - job: DeployPayment
        displayName: Deploy Payment Service
        steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy Payment Container
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(paymentWebAppName)
              containers: $(acrName).azurecr.io/$(paymentImageRepository):$(tag)

      - job: DeployAnalytics
        displayName: Deploy Analytics Service
        steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy Analytics Container
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(analyticsWebAppName)
              containers: $(acrName).azurecr.io/$(analyticsImageRepository):$(tag)
